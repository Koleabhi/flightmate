<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlightMate</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header class="text-center my-5">
            <h1 class="display-4">FlightMate</h1>
            <p class="lead">Simplified Flight Price Prediction</p>
        </header>

        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white">
                        <h3 class="card-title mb-0">Flight Details</h3>
                    </div>
                    <div class="card-body">
                        <form id="flightForm" action="/predict" method="POST">
                            <div class="mb-3">
                                <label for="airline" class="form-label">Airline</label>
                                <select class="form-select" id="airline" name="airline" required>
                                    <option value="">Select Airline</option>
                                    {% for airline in airlines %}
                                    <option value="{{ airline }}">{{ airline }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            
                            <div class="mb-3">
                                <label for="source_city" class="form-label">From</label>
                                <select class="form-select" id="source_city" name="source_city" required>
                                    <option value="">Select City</option>
                                    {% for city in cities %}
                                    <option value="{{ city }}">{{ city }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            
                            <div class="mb-3">
                                <label for="destination_city" class="form-label">To</label>
                                <select class="form-select" id="destination_city" name="destination_city" required>
                                    <option value="">Select City</option>
                                    {% for city in cities %}
                                    <option value="{{ city }}">{{ city }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            
                            <div class="mb-3">
                                <label for="departure_time" class="form-label">Departure Time</label>
                                <select class="form-select" id="departure_time" name="departure_time" required>
                                    <option value="">Select Time</option>
                                    {% for time in times %}
                                    <option value="{{ time }}">{{ time.replace('_', ' ') }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            
                            <div class="mb-3">
                                <label for="class" class="form-label">Class</label>
                                <select class="form-select" id="class" name="class" required>
                                    <option value="">Select Class</option>
                                    {% for class in classes %}
                                    <option value="{{ class }}">{{ class }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            
                            <div class="mb-3">
                                <label for="days_left" class="form-label">Days Before Departure</label>
                                <input type="number" class="form-control" id="days_left" name="days_left" min="1" required>
                            </div>
                            
                            <div class="text-center">
                                <button type="submit" class="btn btn-primary btn-lg">Predict Price</button>
                                <button type="submit" formaction="/recommend" class="btn btn-info ms-2">
                                    Get Recommendations
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
